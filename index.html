<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apartamento 303</title>

    <meta name="theme-color"
          content="#6A1B9A">

    <meta name="description"
          content="Controle Financeiro do Apartamento 303">

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="icons/icon-192.png">

    <link rel="apple-touch-icon"
          href="icons/icon-192.png">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Splash -->

    <div id="splashScreen">

        <img src="icons/icon-192.png"
             alt="Apartamento 303">

        <h1>Apartamento 303</h1>

        <p>Controle Financeiro</p>

    </div>

    <!-- Login -->

    <section id="loginScreen"
             class="screen hidden">

        <div class="card">

            <img src="icons/icon-192.png"
                 class="logo">

            <h2>Bem-vinda</h2>

            <p>

                Faça login utilizando sua conta Google.

            </p>

            <button id="btnLogin"
                    class="primaryButton">

                Entrar com Google

            </button>

        </div>

    </section>

    <!-- Aplicação -->

    <section id="appScreen"
             class="hidden">

        <!-- Cabeçalho -->

        <header>

            <div class="headerLeft">

                <img id="fotoUsuario"
                     class="avatar">

                <div>

                    <span id="nomeUsuario"></span>

                    <small id="emailUsuario"></small>

                </div>

            </div>

            <button id="btnDashboard">

                Dashboard

            </button>

        </header>

        <!-- Cadastro -->

        <main>

            <div class="card">

                <h2>

                    Nova Despesa

                </h2>

                <form id="formDespesa">

                    <!-- Data -->

                    <div class="campo">

                        <label>

                            Data *

                        </label>

                        <input

                            type="date"

                            id="data"

                            required>

                    </div>

                    <!-- Categoria -->

                    <div class="campo">

                        <label>

                            Categoria *

                        </label>

                        <select

                            id="categoria"

                            required>

                            <option value="">

                                Selecione

                            </option>

                        </select>

                    </div>

                    <!-- Valor -->

                    <div class="campo">

                        <label>

                            Valor *

                        </label>

                        <input

                            type="text"

                            id="valor"

                            placeholder="0,00"

                            autocomplete="off"

                            required>

                    </div>

                    <!-- Quem pagou -->

                    <div class="campo">

                        <label>

                            Quem pagou? *

                        </label>

                        <select

                            id="pagante"

                            required>

                            <option>

                                Jessica

                            </option>

                            <option>

                                Juliana

                            </option>

                        </select>

                    </div>

                    <!-- Tipo -->
