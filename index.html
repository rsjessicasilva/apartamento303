<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle Apartamento 303</title>

    <meta name="theme-color" content="#6A1B9A">

    <meta name="description"
          content="Controle financeiro do Apartamento 303">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <img
            src="icons/icon-512.png"
            class="logo"
            alt="Apartamento 303">

        <div>

            <h1>Apartamento 303</h1>

            <span class="subtitulo">
                Controle Financeiro
            </span>

        </div>

    </header>

    <section class="card">

        <h2>Nova Despesa</h2>

        <form id="formDespesa">

            <div class="campo">

                <label for="data">

                    Data

                </label>

                <input
                    type="date"
                    id="data"
                    required>

            </div>

            <div class="campo">

                <label for="descricao">

                    Descrição

                </label>

                <input
                    type="text"
                    id="descricao"
                    maxlength="80"
                    placeholder="Ex.: Mercado"
                    required>

            </div>

            <div class="campo">

                <label for="categoria">

                    Categoria

                </label>

                <select
                    id="categoria"
                    required>

                    <option value="">Selecione...</option>

                    <option>Mercado</option>
                    <option>Energia Casa</option>
                    <option>Internet Casa</option>
                    <option>Energia Apto</option>
                    <option>Internet Apto</option>
                    <option>Condomínio</option>
                    <option>Apartamento</option>
                    <option>Outros</option>

                </select>

            </div>

            <div class="campo">

                <label for="valor">

                    Valor (R$)

                </label>

                <input
                    type="number"
                    id="valor"
                    step="0.01"
                    min="0.01"
                    placeholder="0,00"
                    required>

            </div>

            <div class="campo">

                <label for="pagante">

                    Quem pagou?

                </label>

                <select
                    id="pagante"
                    required>

                    <option value="">Selecione...</option>

                    <option>Jessica</option>

                    <option>Juliana</option>

                </select>

            </div>

            <button
                id="btnSalvar"
                type="submit">

                💾 Salvar Despesa

            </button>

        </form>

        <div
            id="loading"
            class="loading oculto">

            Salvando despesa...

        </div>

        <div
            id="mensagem"
            class="mensagem">

        </div>

    </section>

    <footer>

        Apartamento 303 © 2026

    </footer>

</div>

<script src="app.js"></script>

    <script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("sw.js");

}

</script>
    
</body>

</html>
