<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Apartamento</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2E7D32">

</head>


<body>

<div class="container">

    <h1>🏠 Controle Apartamento</h1>


    <div class="card">

        <h2>Nova Despesa</h2>


        <label>
            Data
        </label>

        <input 
            type="date" 
            id="data">


        <label>
            Descrição
        </label>

        <input 
            type="text" 
            id="descricao"
            placeholder="Ex: Mercado">


        <label>
            Categoria
        </label>

        <select id="categoria">

            <option>Mercado</option>
            <option>Água</option>
            <option>Luz</option>
            <option>Internet</option>
            <option>Condomínio</option>
            <option>Gás</option>
            <option>Outros</option>

        </select>


        <label>
            Valor
        </label>

        <input 
            type="number"
            id="valor"
            placeholder="0,00">


        <label>
            Quem pagou?
        </label>

        <select id="pagante">

            <option>Maria</option>
            <option>Ana</option>

        </select>


        <button id="btnSalvar">
            Salvar despesa
        </button>


        <p id="mensagem"></p>


    </div>


</div>


<script src="app.js"></script>


</body>

</html>
