<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro • Apartamento 303</title>

    <meta name="theme-color"
          content="#6A1B9A">

    <meta name="description"
          content="Controle financeiro compartilhado do Apartamento 303">

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <section id="loginTela">

        <div class="login-card">

            <img
                src="icons/icon-512.png"
                class="logo">

            <h1>Apartamento 303</h1>

            <p>

                Controle Financeiro Compartilhado

            </p>

            <button id="btnLogin">

                Entrar com Google

            </button>

        </div>

    </section>

    <!-- APP -->

    <section id="appTela" style="display:none;">

        <header>

            <div class="usuario">

                <img
                    id="fotoUsuario"
                    class="foto">

                <div>

                    <span id="nomeUsuario"></span>

                    <small id="emailUsuario"></small>

                </div>

            </div>

            <button
                id="btnLogout"
                class="btn-secundario">

                Sair

            </button>

        </header>

        <!-- DASHBOARD -->

        <section class="card">

            <h2>

                Resumo do mês

            </h2>

            <div class="dashboard">

                <div class="info">

                    <span>Jessica</span>

                    <strong id="totalJessica">

                        R$ 0,00

                    </strong>

                </div>

                <div class="info">

                    <span>Juliana</span>

                    <strong id="totalJuliana">

                        R$ 0,00

                    </strong>

                </div>

                <div class="info destaque">

                    <span>

                        Resultado

                    </span>

                    <strong id="resultado">

                        -

                    </strong>

                </div>

            </div>

        </section>

        <!-- NOVA DESPESA -->

        <section class="card">

            <h2>

                Nova Despesa

            </h2>

            <form id="formDespesa">

                <div class="campo">

                    <label>

                        Data *

                    </label>

                    <input
                        type="date"
                        id="data"
                        required>

                </div>

                <div class="campo">

                    <label>

                        Categoria *

                    </label>

                    <select
                        id="categoria"
                        required>

                        <option value="">

                            Selecione...

                        </option>

                        <option>Condomínio</option>

                        <option>Apartamento</option>

                        <option>Mercado</option>

                        <option>Energia</option>

                        <option>Internet</option>

                        <option>Água</option>

                        <option>Limpeza</option>

                        <option>Manutenção</option>

                        <option>Outros</option>

                    </select>

                </div>

                <div class="campo">

                    <label>

                        Valor *

                    </label>

                    <input
                        id="valor"
                        type="text"
                        inputmode="decimal"
                        placeholder="140,00"
                        required>

                </div>

                <div class="campo">

                    <label>

                        Quem pagou? *

                    </label>

               <div class="campo">

<label>

Quem pagou? *

</label>

<div
id="paganteSegmentado"
class="segmentado">

</div>

</div>

                </div>

                <div class="campo">

                    <label>

                        Tipo da despesa *

                    </label>

                    <div class="radio-group">

                        <label>

                            <input
                                type="radio"
                                name="tipo"
                                value="DIVIDIDA"
                                checked>

                            Dividida entre as duas

                        </label>

                        <label>

                            <input
                                type="radio"
                                name="tipo"
                                value="OUTRA_PAGA">

                            Somente a outra irmã paga

                        </label>

                    </div>

                </div>

                <div class="campo">

                    <label>

                        Observação

                    </label>

                    <textarea
                        id="observacao"
                        rows="4"
                        maxlength="500"
                        placeholder="Informações adicionais (opcional)"></textarea>

                </div>

                <button
                    id="btnSalvar"
                    type="submit">

                    Salvar Despesa

                </button>

            </form>

        </section>

        <!-- HISTÓRICO -->

        <section class="card">

            <div class="titulo-card">

                <h2>

                    Histórico

                </h2>

                <button
                    id="btnAtualizarHistorico"
                    class="btn-secundario">

                    Atualizar

                </button>

            </div>

            <div id="listaHistorico">

                Nenhuma despesa cadastrada.

            </div>

        </section>

        <!-- FECHAMENTO -->

        <section class="card">

            <h2>

                Fechamento do mês

            </h2>

            <button
                id="btnFecharMes"
                class="btn-perigo">

                Fechar Mês

            </button>

        </section>

    </section>

</div>

<!-- MODAL SENHA -->

<div
    id="modalSenha"
    class="modal">

    <div class="modal-conteudo">

        <h3>

            Fechar mês

        </h3>

        <p>

            Digite a senha para continuar.

        </p>

        <input
            type="password"
            id="senhaFechamento"
            maxlength="4"
            placeholder="Senha">

        <div class="acoes">

            <button id="cancelarModal">

                Cancelar

            </button>

            <button id="confirmarFechamento">

                Confirmar

            </button>

        </div>

    </div>

</div>

<!-- LOADING -->

<div
    id="loading"
    class="loading">

    Carregando...

</div>

<!-- TOAST -->

<div
    id="toast">

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="app.js"></script>

<script type="module" src="dashboard.js"></script>

<script type="module" src="historico.js"></script>

<script type="module" src="fechamento.js"></script>

<script type="module" src="exportar.js"></script>

</body>

</html>
